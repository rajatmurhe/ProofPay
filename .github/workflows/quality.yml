name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/api/requirements.lock
            ml/requirements.lock
      - run: pip install -r services/api/requirements.lock -r ml/requirements.lock
      - run: PYTHONPATH=services/api python -m pytest services/api/tests ml/tests -q
      - run: python -m alembic -c services/api/alembic.ini upgrade head
      - run: python ml/train.py && python evaluation/compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-results
          path: |
            ml/reports/classifier-report.json
            evaluation/reports/extraction-comparison.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yml config --quiet
