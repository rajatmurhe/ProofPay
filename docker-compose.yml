services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proofpay
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: proofpay
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - proofpay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpay -d proofpay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  proofpay-db:
